apiVersion: v1
kind: Pod
metadata:
  name: net-debug
  namespace: shoppay-gateway
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault

  containers:
  - name: curl
    image: busybox:1.36
    command:
    - sleep
    - "3600"

    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
