    - backend/services/payment-service/node_modules/
    - backend/services/contact-service/node_modules/

# =========================
# VALIDATION STAGE
# =========================

frontend_lint:
  stage: validate
  image: node:22-alpine
  rules:
    - changes:
        - frontend/**/*
  script:
    - cd frontend
    - npm ci
    - npm run lint

frontend_build:
  stage: validate
  image: node:22-alpine
  rules:
    - changes:
        - frontend/**/*
  script:
    - cd frontend
    - npm ci
    - npm run build

# =========================
# BACKEND VALIDATION
# =========================

.backend_template: &backend_template
  image: node:22-alpine
  stage: validate

backend_product_build:
  <<: *backend_template
  rules:
    - changes:
        - backend/services/product-service/**/*
  script:
    - cd backend/services/product-service
    - npm ci --omit=dev
    - node --check src/index.js

backend_order_build:
  <<: *backend_template
  rules:
    - changes:
        - backend/services/order-service/**/*
  script:
    - cd backend/services/order-service
    - npm ci --omit=dev
    - node --check src/index.js

backend_payment_build:
  <<: *backend_template
  rules:
    - changes:
        - backend/services/payment-service/**/*
  script:
    - cd backend/services/payment-service
    - npm ci --omit=dev
    - node --check src/index.js

backend_contact_build:
  <<: *backend_template
  rules:
    - changes:
        - backend/services/contact-service/**/*
  script:
    - cd backend/services/contact-service
    - npm ci --omit=dev
    - node --check src/index.js

# =========================
# HELM VALIDATION
# =========================

helm_validate:
  stage: validate
  image: alpine:3.20
  rules:
    - changes:
        - charts/**/*
  before_script:
    - apk add --no-cache curl bash git openssl
    - curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  script:
    - helm lint charts/shoppay
    - helm template shoppay charts/shoppay > rendered.yaml
  artifacts:
    paths:
      - rendered.yaml

# =========================
# DOCKERFILE LINT
# =========================

dockerfile_lint:
  stage: validate
  image: hadolint/hadolint:latest-debian
  rules:
    - changes:
        - "**/Dockerfile"
  script:
    - hadolint frontend/Dockerfile
    - hadolint backend/services/product-service/Dockerfile
    - hadolint backend/services/order-service/Dockerfile
    - hadolint backend/services/payment-service/Dockerfile
    - hadolint backend/services/contact-service/Dockerfile

