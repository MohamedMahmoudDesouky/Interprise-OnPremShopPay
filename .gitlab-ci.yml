stages:
  - validate
  - build
  - security

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  DOCKER_BUILDKIT: "1"

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"

# =========================
# CACHE (OPTIMIZED)
# =========================

cache:
  key: "$CI_PROJECT_NAME-$CI_COMMIT_REF_SLUG"
  paths:
    - frontend/node_modules/
    - backend/services/product-service/node_modules/
    - backend/services/order-service/node_modules/
    - backend/services/payment-service/node_modules/
    - backend/services/contact-service/node_modules/

# =========================
# VALIDATION
# =========================

frontend_lint:
  stage: validate
  image: node:22-alpine
  rules:
    - changes:
        - frontend/**/*
  script:
    - cd frontend
    - npm ci
    - npm run lint

frontend_build:
  stage: validate
  image: node:22-alpine
  rules:
    - changes:
        - frontend/**/*
  script:
    - cd frontend
    - npm ci
    - npm run build

backend_product_build:
  stage: validate
  image: node:22-alpine
  rules:
    - changes:
        - backend/services/product-service/**/*
  script:
    - cd backend/services/product-service
    - npm ci --omit=dev
    - node --check src/index.js

backend_order_build:
  stage: validate
  image: node:22-alpine
  rules:
    - changes:
        - backend/services/order-service/**/*
  script:
    - cd backend/services/order-service
    - npm ci --omit=dev
    - node --check src/index.js

backend_payment_build:
  stage: validate
  image: node:22-alpine
  rules:
    - changes:
        - backend/services/payment-service/**/*
  script:
    - cd backend/services/payment-service
    - npm ci --omit=dev
    - node --check src/index.js

backend_contact_build:
  stage: validate
  image: node:22-alpine
  rules:
    - changes:
        - backend/services/contact-service/**/*
  script:
    - cd backend/services/contact-service
    - npm ci --omit=dev
    - node --check src/index.js

helm_validate:
  stage: validate
  image: alpine:3.20
  rules:
    - changes:
        - charts/**/*
  before_script:
    - apk add --no-cache curl bash git openssl
    - curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  script:
    - helm lint charts/shoppay
    - helm template shoppay charts/shoppay > rendered.yaml
  artifacts:
    paths:
      - rendered.yaml

dockerfile_lint:
  stage: validate
  image: hadolint/hadolint:latest-debian
  rules:
    - changes:
        - "**/Dockerfile"
  script:
    - hadolint frontend/Dockerfile
    - hadolint backend/services/product-service/Dockerfile
    - hadolint backend/services/order-service/Dockerfile
    - hadolint backend/services/payment-service/Dockerfile
    - hadolint backend/services/contact-service/Dockerfile

# =========================
# BUILD STAGE
# =========================

.build_template:
  stage: build
  image: docker:27.0.3
  services:
    - docker:27.0.3-dind
  before_script:
    - docker info
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

docker_build_product:
  extends: .build_template
  rules:
    - changes:
        - backend/services/product-service/**/*
  script:
    - docker build -t $DOCKERHUB_USERNAME/shoppay-product:$IMAGE_TAG -t $DOCKERHUB_USERNAME/shoppay-product:latest ./backend/services/product-service
    - docker push $DOCKERHUB_USERNAME/shoppay-product:$IMAGE_TAG
    - docker push $DOCKERHUB_USERNAME/shoppay-product:latest

docker_build_order:
  extends: .build_template
  rules:
    - changes:
        - backend/services/order-service/**/*
  script:
    - docker build -t $DOCKERHUB_USERNAME/shoppay-order:$IMAGE_TAG -t $DOCKERHUB_USERNAME/shoppay-order:latest ./backend/services/order-service
    - docker push $DOCKERHUB_USERNAME/shoppay-order:$IMAGE_TAG
    - docker push $DOCKERHUB_USERNAME/shoppay-order:latest

docker_build_payment:
  extends: .build_template
  rules:
    - changes:
        - backend/services/payment-service/**/*
  script:
    - docker build -t $DOCKERHUB_USERNAME/shoppay-payment:$IMAGE_TAG -t $DOCKERHUB_USERNAME/shoppay-payment:latest ./backend/services/payment-service
    - docker push $DOCKERHUB_USERNAME/shoppay-payment:$IMAGE_TAG
    - docker push $DOCKERHUB_USERNAME/shoppay-payment:latest

docker_build_contact:
  extends: .build_template
  rules:
    - changes:
        - backend/services/contact-service/**/*
  script:
    - docker build -t $DOCKERHUB_USERNAME/shoppay-contact:$IMAGE_TAG -t $DOCKERHUB_USERNAME/shoppay-contact:latest ./backend/services/contact-service
    - docker push $DOCKERHUB_USERNAME/shoppay-contact:$IMAGE_TAG
    - docker push $DOCKERHUB_USERNAME/shoppay-contact:latest

docker_build_frontend:
  extends: .build_template
  rules:
    - changes:
        - frontend/**/*
  script:
    - docker build --build-arg NEXT_PUBLIC_API_BASE_URL=/api \
      -t $DOCKERHUB_USERNAME/shoppay-frontend:$IMAGE_TAG \
      -t $DOCKERHUB_USERNAME/shoppay-frontend:latest \
      ./frontend
    - docker push $DOCKERHUB_USERNAME/shoppay-frontend:$IMAGE_TAG
    - docker push $DOCKERHUB_USERNAME/shoppay-frontend:latest

# =========================
# SECURITY (RULES MIRROR BUILD)
# =========================

.trivy_template:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]

trivy_secrets:
  extends: .trivy_template
  script:
    - trivy fs --scanners secret --exit-code 1 .

trivy_k8s_config:
  extends: .trivy_template
  rules:
    - changes:
        - charts/**/*
  script:
    - trivy config --severity HIGH,CRITICAL --exit-code 1 charts/shoppay

# =========================
# IMAGE SCANS (NO ARTIFACTS, NO NEEDS)
# RULES MIRROR BUILD
# =========================

trivy_product_image:
  extends: .trivy_template
  rules:
    - changes:
        - backend/services/product-service/**/*
  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 1 $DOCKERHUB_USERNAME/shoppay-product:$IMAGE_TAG

trivy_order_image:
  extends: .trivy_template
  rules:
    - changes:
        - backend/services/order-service/**/*
  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 1 $DOCKERHUB_USERNAME/shoppay-order:$IMAGE_TAG

trivy_payment_image:
  extends: .trivy_template
  rules:
    - changes:
        - backend/services/payment-service/**/*
  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 1 $DOCKERHUB_USERNAME/shoppay-payment:$IMAGE_TAG

trivy_contact_image:
  extends: .trivy_template
  rules:
    - changes:
        - backend/services/contact-service/**/*
  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 1 $DOCKERHUB_USERNAME/shoppay-contact:$IMAGE_TAG

trivy_frontend_image:
  extends: .trivy_template
  rules:
    - changes:
        - frontend/**/*
  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 1 $DOCKERHUB_USERNAME/shoppay-frontend:$IMAGE_TAG