stages:
  - validate
  - build
  - security

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  DOCKER_BUILDKIT: "1"
default:
  interruptible: true


workflow:  
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"

    
cache:
  paths:
    - frontend/node_modules/
    - backend/services/product-service/node_modules/
    - backend/services/order-service/node_modules/
    - backend/services/payment-service/node_modules/
    - backend/services/contact-service/node_modules/
# =========================
# VALIDATION STAGE
# =========================

frontend_lint:
  stage: validate
  image: node:22-alpine

  script:
    - cd frontend
    - npm ci
    - npm run lint

frontend_build:
  stage: validate
  image: node:22-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build

backend_product_build:
  stage: validate
  image: node:22-alpine
  before_script:
    - cd backend/services/product-service
    - npm ci --omit=dev
  script:
    - node --check src/index.js

backend_order_build:
  stage: validate
  image: node:22-alpine
  before_script:
    - cd backend/services/order-service
    - npm ci --omit=dev
  script:
    - node --check src/index.js

backend_payment_build:
  stage: validate
  image: node:22-alpine
  before_script:
    - cd backend/services/payment-service
    - npm ci --omit=dev
  script:
    - node --check src/index.js

backend_contact_build:
  stage: validate
  image: node:22-alpine
  before_script:
    - cd backend/services/contact-service
    - npm ci --omit=dev
  script:
    - node --check src/index.js

helm_validate:
  stage: validate
  image: alpine:3.20

  before_script:
    - apk add --no-cache curl bash git openssl
    - curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

  script:
    - helm version
    - helm lint charts/shoppay
    - helm template shoppay charts/shoppay > shoppay-rendered.yaml

  artifacts:
    paths:
      - shoppay-rendered.yaml
  
dockerfile_lint:
  stage: validate
  image: hadolint/hadolint:latest-debian

  script:
    - hadolint backend/services/product-service/Dockerfile
    - hadolint backend/services/order-service/Dockerfile
    - hadolint backend/services/payment-service/Dockerfile
    - hadolint backend/services/contact-service/Dockerfile
    - hadolint frontend/Dockerfile        
# =========================
# BUILD STAGE
# =========================

docker_build_product:
  stage: build
  image: docker:27.0.3
  services:
    - docker:27.0.3-dind
  before_script:
    - docker info
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
  script:
    - docker build -t shoppay-product:$IMAGE_TAG ./backend/services/product-service

docker_build_order:
  stage: build
  image: docker:27.0.3
  services:
    - docker:27.0.3-dind
  before_script:
    - docker info
  script:
    - docker build -t shoppay-order:$IMAGE_TAG ./backend/services/order-service

docker_build_payment:
  stage: build
  image: docker:27.0.3
  services:
    - docker:27.0.3-dind
  before_script:
    - docker info
  script:
    - docker build -t shoppay-payment:$IMAGE_TAG ./backend/services/payment-service

docker_build_contact:
  stage: build
  image: docker:27.0.3
  services:
    - docker:27.0.3-dind
  before_script:
    - docker info
  script:
    - docker build -t shoppay-contact:$IMAGE_TAG ./backend/services/contact-service

docker_build_frontend:
  stage: build
  image: docker:27.0.3
  services:
    - docker:27.0.3-dind
  before_script:
    - docker info
  script:
   - docker info
   - |
     docker build \
       --build-arg NEXT_PUBLIC_API_BASE_URL=/api \
       -t shoppay-frontend:$IMAGE_TAG \
       ./frontend
# =========================
# SECURITY STAGE
# =========================

trivy_image_product:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]

  script:
    - trivy image --severity HIGH,CRITICAL --exit-code 1 shoppay-product:$IMAGE_TAG


trivy_product:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]

  script:
    - trivy fs \
      --severity HIGH,CRITICAL \
      --exit-code 1 \
      --format json \
      --output trivy-product-report.json \
      ./backend/services/product-service

  artifacts:
    when: always
    paths:
      - trivy-product-report.json
trivy_order:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --severity HIGH,CRITICAL --exit-code 1 --format json --output trivy-order-report.json ./backend/services/order-service
  artifacts:
    when: always
    paths:
      - trivy-order-report.json


trivy_image_order:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]

  script:
    - trivy image \
      --severity HIGH,CRITICAL \
      --exit-code 1 \
      shoppay-order:$IMAGE_TAG


trivy_payment:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --severity HIGH,CRITICAL --exit-code 1 --format json --output trivy-payment-report.json ./backend/services/payment-service
  artifacts:
    when: always
    paths:
      - trivy-payment-report.json


trivy_image_payment:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]

  script:
    - trivy image \
      --severity HIGH,CRITICAL \
      --exit-code 1 \
      shoppay-payment:$IMAGE_TAG


trivy_contact:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --severity HIGH,CRITICAL --exit-code 1 --format json --output trivy-contact-report.json ./backend/services/contact-service
  artifacts:
    when: always
    paths:
      - trivy-contact-report.json


trivy_image_contact:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]

  script:
    - trivy image \
      --severity HIGH,CRITICAL \
      --exit-code 1 \
      shoppay-contact:$IMAGE_TAG



trivy_frontend:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --severity HIGH,CRITICAL --exit-code 1 --format json --output trivy-frontend-report.json ./frontend
  artifacts:
    when: always
    paths:
      - trivy-frontend-report.json
trivy_secrets:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]

  script:
    - trivy fs --scanners secret --exit-code 1 .

trivy_image_frontend:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]

  script:
    - trivy image \
      --severity HIGH,CRITICAL \
      --exit-code 1 \
      shoppay-frontend:$IMAGE_TAG



trivy_k8s_config:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]

  script:
    - trivy config --severity HIGH,CRITICAL --exit-code 1 charts/shoppay
