stages:
  - validate
  - build
  - security
  - package

variables:
  DOCKER_DRIVER: overlay2
  # Disable Docker TLS for simplicity in local/self-hosted runners
  # If you need TLS, ensure your runner is properly configured with certs
  DOCKER_TLS_CERTDIR: ""

default:
  # No tags specified - jobs will run on any available runner
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/
      - frontend/node_modules/
      - backend/services/*/node_modules/


# =========================
# FRONTEND VALIDATION (FIXED)
# =========================

frontend_lint:
  stage: validate
  image: node:22-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    # Use npx to ensure next.js CLI is properly resolved
    - npx next lint --dir . --max-warnings 0
  # Optional: cache ESLint results
  cache:
    key: ${CI_COMMIT_REF_SLUG}-frontend
    paths:
      - frontend/node_modules/
      - frontend/.next/cache/eslint/

frontend_build:
  stage: validate
  image: node:22-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    # Ensure NEXT_PUBLIC variables are set correctly for CI
    - export NEXT_PUBLIC_API_BASE_URL="${NEXT_PUBLIC_API_BASE_URL:-http://localhost:30080}"
    - npm run build
  artifacts:
    paths:
      - frontend/.next/
    expire_in: 1 hour

# =========================
# BACKEND VALIDATION
# =========================

backend_product_build:
  stage: validate
  image: node:22-alpine
  before_script:
    - cd backend/services/product-service
    - npm ci
  script:
    - node --check src/index.js

backend_order_build:
  stage: validate
  image: node:22-alpine
  before_script:
    - cd backend/services/order-service
    - npm ci
  script:
    - node --check src/index.js

backend_payment_build:
  stage: validate
  image: node:22-alpine
  before_script:
    - cd backend/services/payment-service
    - npm ci
  script:
    - node --check src/index.js

backend_contact_build:
  stage: validate
  image: node:22-alpine
  before_script:
    - cd backend/services/contact-service
    - npm ci
  script:
    - node --check src/index.js

# =========================
# HELM VALIDATION
# =========================

helm_validate:
  stage: validate
  image: alpine/helm:3.15.4
  script:
    - helm lint charts/shoppay
    - helm template shoppay charts/shoppay > shoppay-rendered.yaml
    - grep -n "shoppay-product-service" shoppay-rendered.yaml
  artifacts:
    paths:
      - shoppay-rendered.yaml

# =========================
# DOCKER BUILDS + SECURITY SCAN (MERGED)
# =========================
# Images are scanned immediately after building to avoid persistence issues

docker_build_frontend:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  retry: 2
  script:
    - docker build -t shoppay-frontend:test ./frontend
    # Run Trivy scan in the same job
    - docker run --rm
        -v /var/run/docker.sock:/var/run/docker.sock
        aquasec/trivy:latest image --severity HIGH,CRITICAL --exit-code 1 shoppay-frontend:test

docker_build_product:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  retry: 2
  script:
    - docker build -t shoppay-product:test ./backend/services/product-service
    - docker run --rm
        -v /var/run/docker.sock:/var/run/docker.sock
        aquasec/trivy:latest image --severity HIGH,CRITICAL --exit-code 1 shoppay-product:test

docker_build_order:
