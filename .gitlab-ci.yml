  retry: 2
  script:
    - docker build -t shoppay-contact:test ./backend/services/contact-service
    - docker run --rm
        -v /var/run/docker.sock:/var/run/docker.sock
        aquasec/trivy:latest image --severity HIGH,CRITICAL --exit-code 1 shoppay-contact:test

# =========================
# PACKAGE STAGE
# =========================

helm_package:
  stage: package
  image: alpine/helm:3.15.4
  script:
    - helm package charts/shoppay
  artifacts:
    paths:
      - shoppay-*.tgz
    expire_in: 1 week

# =========================
# WORKFLOW RULES (Optional but Recommended)
# =========================

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "dev"
    - if: $CI_COMMIT_BRANCH == "main"
