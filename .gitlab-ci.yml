stages:
  - validate
  - build
  - security

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

default:
  interruptible: true

# =========================
# VALIDATION STAGE
# =========================

frontend_lint:
  stage: validate
  image: node:22-alpine

  script:
    - cd frontend
    - npm ci
    - npm run lint

frontend_build:
  stage: validate
  image: node:22-alpine
  before_script:
    - cd frontend
    - npm ci
  script:
    - npm run build

backend_product_build:
  stage: validate
  image: node:22-alpine
  before_script:
    - cd backend/services/product-service
    - npm ci --omit=dev
  script:
    - node --check src/index.js

backend_order_build:
  stage: validate
  image: node:22-alpine
  before_script:
    - cd backend/services/order-service
    - npm ci --omit=dev
  script:
    - node --check src/index.js

backend_payment_build:
  stage: validate
  image: node:22-alpine
  before_script:
    - cd backend/services/payment-service
    - npm ci --omit=dev
  script:
    - node --check src/index.js

backend_contact_build:
  stage: validate
  image: node:22-alpine
  before_script:
    - cd backend/services/contact-service
    - npm ci --omit=dev
  script:
    - node --check src/index.js

helm_validate:
  stage: validate
  image: alpine:3.20

  before_script:
    - apk add --no-cache curl bash git openssl
    - curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

  script:
    - helm version
    - helm lint charts/shoppay
    - helm template shoppay charts/shoppay > shoppay-rendered.yaml

  artifacts:
    paths:
      - shoppay-rendered.yaml
# =========================
# BUILD STAGE
# =========================

docker_build_product:
  stage: build
  image: docker:27.0.3
  services:
    - docker:27.0.3-dind
  before_script:
    - docker info
  script:
    - docker build -t shoppay-product:$IMAGE_TAG ./backend/services/product-service

docker_build_order:
  stage: build
  image: docker:27.0.3
  services:
    - docker:27.0.3-dind
  before_script:
    - docker info
  script:
    - docker build -t shoppay-order:$IMAGE_TAG ./backend/services/order-service

docker_build_payment:
  stage: build
  image: docker:27.0.3
  services:
    - docker:27.0.3-dind
  before_script:
    - docker info
  script:
    - docker build -t shoppay-payment:$IMAGE_TAG ./backend/services/payment-service

docker_build_contact:
  stage: build
  image: docker:27.0.3
  services:
    - docker:27.0.3-dind
  before_script:
    - docker info
  script:
    - docker build -t shoppay-contact:$IMAGE_TAG ./backend/services/contact-service

docker_build_frontend:
  stage: build
  image: docker:27.0.3
  services:
    - docker:27.0.3-dind
  before_script:
    - docker info
  script:
   - docker info
   - |
     docker build \
       --build-arg NEXT_PUBLIC_API_BASE_URL=/api \
       -t shoppay-frontend:$IMAGE_TAG \
       ./frontend
# =========================
# SECURITY STAGE
# =========================

trivy_product:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --severity HIGH,CRITICAL --exit-code 1 ./backend/services/product-service

trivy_order:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --severity HIGH,CRITICAL --exit-code 1 ./backend/services/order-service

trivy_payment:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --severity HIGH,CRITICAL --exit-code 1 ./backend/services/payment-service

trivy_contact:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --severity HIGH,CRITICAL --exit-code 1 ./backend/services/contact-service

trivy_frontend:
  stage: security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy fs --severity HIGH,CRITICAL --exit-code 1 ./frontend
