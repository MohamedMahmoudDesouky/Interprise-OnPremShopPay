.build_template:
  stage: build
  image: docker:27.0.3
  services:
    - docker:27.0.3-dind
  before_script:
    - docker info
    - echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - mkdir -p $DOCKER_IMAGE_DIR

docker_build_product:
  extends: .build_template
  rules:
    - changes:
        - backend/services/product-service/**/*
  script:
    - docker build -t $DOCKERHUB_USERNAME/shoppay-product:$IMAGE_TAG ./backend/services/product-service
    - docker push $DOCKERHUB_USERNAME/shoppay-product:$IMAGE_TAG
    - echo "$DOCKERHUB_USERNAME/shoppay-product:$IMAGE_TAG" > $DOCKER_IMAGE_DIR/product.txt
  artifacts:
    paths:
      - build-artifacts/product.txt
    expire_in: 1 hour

