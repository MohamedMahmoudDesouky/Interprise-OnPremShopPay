global:
  projectName: shoppay
  environment: dev

namespaces:
  frontend: shoppay-frontend
  gateway: shoppay-gateway
  product: shoppay-product
  order: shoppay-order
  payment: shoppay-payment
  contact: shoppay-contact
  vault: shoppay-vault

serviceAccounts:
  frontend:
    name: frontend-sa
  apiGateway:
    name: api-gateway-sa
  productService:
    name: product-service-sa
  orderService:
    name: order-service-sa
  paymentService:
    name: payment-service-sa
  contactService:
    name: contact-service-sa

productPostgresql:
  enabled: true

orderPostgresql:
  enabled: true

paymentPostgresql:
  enabled: true

contactPostgresql:
  enabled: true

product-postgresql:
  enabled: true
  namespaceOverride: shoppay-product
  architecture: standalone
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 17.6.0-debian-12-r4
  auth:
    username: product_user
    database: productdb
    existingSecret: product-db-credentials
    secretKeys:
      adminPasswordKey: postgres-password
      userPasswordKey: password
  primary:
    persistence:
      enabled: true
      storageClass: local-path
      size: 2Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    podSecurityContext:
      enabled: true
      fsGroup: 1001
    containerSecurityContext:
      enabled: true
      runAsUser: 1001
      runAsGroup: 1001
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: false
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault

