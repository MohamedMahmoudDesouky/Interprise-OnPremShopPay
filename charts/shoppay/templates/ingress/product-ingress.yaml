{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: product-service
  namespace: {{ .Values.namespaces.product }}
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: shoppay

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    - http:
        paths:
          - path: /api/products
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 4001

          - path: /api/admin
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 4001

{{- end }}
