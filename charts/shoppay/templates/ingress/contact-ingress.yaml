{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: contact-service
  namespace: {{ .Values.namespaces.contact }}
  labels:
    app.kubernetes.io/name: contact-service
    app.kubernetes.io/part-of: shoppay

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    - http:
        paths:
          - path: /api/contact
            pathType: Prefix
            backend:
              service:
                name: contact-service
                port:
                  number: 4004

{{- end }}
