{{- if .Values.ingress.enabled }}

apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: order-service
  namespace: {{ .Values.namespaces.order }}
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: shoppay

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    - http:
        paths:
          - path: /api/orders
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 4002

{{- end }}
