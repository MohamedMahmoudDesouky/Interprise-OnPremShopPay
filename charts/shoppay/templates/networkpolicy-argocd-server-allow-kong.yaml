{{- if .Values.argocd.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: argocd-server-allow-kong
  namespace: {{ .Values.argocd.namespace }}
  labels:
    app.kubernetes.io/name: argocd-server-allow-kong
    app.kubernetes.io/part-of: shoppay

spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: argocd-server

  policyTypes:
    - Ingress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: shoppay-gateway

          podSelector:
            matchLabels:
              app.kubernetes.io/name: kong

      ports:
        - protocol: TCP
          port: 8080
{{- end }}
