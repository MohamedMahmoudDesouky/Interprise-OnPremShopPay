{{- if .Values.contactService.enabled }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.contactService.name }}
  namespace: {{ .Values.namespaces.contact }}
  labels:
    app.kubernetes.io/name: {{ .Values.contactService.name }}
    app.kubernetes.io/part-of: shoppay

spec:
  replicas: {{ .Values.contactService.replicaCount }}

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.contactService.name }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.contactService.name }}
        app.kubernetes.io/part-of: shoppay

    spec:
      serviceAccountName: {{ .Values.serviceAccounts.contactService.name }}
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: {{ .Values.contactService.name }}

          image: "{{ .Values.contactService.image.repository }}:{{ .Values.contactService.image.tag }}"
          imagePullPolicy: {{ .Values.contactService.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.contactService.service.targetPort }}
              protocol: TCP

          env:
            - name: PORT
              value: {{ .Values.contactService.env.port | quote }}

            - name: CONTACT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.contactService.env.databaseSecretName }}
                  key: {{ .Values.contactService.env.databasePasswordKey }}

            - name: DATABASE_URL
              value: "postgresql://{{ .Values.contactService.env.databaseUser }}:$(CONTACT_DB_PASSWORD)@{{ .Values.contactService.env.databaseHost }}:{{ .Values.contactService.env.databasePort }}/{{ .Values.contactService.env.databaseName }}"

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          resources:
{{ toYaml .Values.contactService.resources | indent 12 }}

          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.contactService.name }}
  namespace: {{ .Values.namespaces.contact }}
  labels:
    app.kubernetes.io/name: {{ .Values.contactService.name }}
    app.kubernetes.io/part-of: shoppay
  annotations:
    ingress.kubernetes.io/service-upstream: "true"

spec:
  type: {{ .Values.contactService.service.type }}

  selector:
    app.kubernetes.io/name: {{ .Values.contactService.name }}

  ports:
    - name: http
      port: {{ .Values.contactService.service.port }}
      targetPort: http
      protocol: TCP

{{- end }}
