{{- if .Values.productService.enabled }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.productService.name }}
  namespace: {{ .Values.namespaces.product }}
  labels:
    app.kubernetes.io/name: {{ .Values.productService.name }}
    app.kubernetes.io/part-of: shoppay

spec:
  replicas: {{ .Values.productService.replicaCount }}

  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.productService.name }}

  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.productService.name }}
        app.kubernetes.io/part-of: shoppay
      {{- if .Values.productService.vault.enabled }}
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: {{ .Values.productService.vault.role | quote }}
        vault.hashicorp.com/agent-inject-secret-admin-auth.json: {{ .Values.productService.vault.secretPath | quote }}
        vault.hashicorp.com/agent-inject-template-admin-auth.json: |
          {{`{{- with secret "`}}{{ .Values.productService.vault.secretPath }}{{`" -}}`}}
          {
            "ADMIN_USERNAME": "{{`{{ .Data.data.ADMIN_USERNAME }}`}}",
            "ADMIN_PASSWORD_HASH": "{{`{{ .Data.data.ADMIN_PASSWORD_HASH }}`}}",
            "JWT_SECRET": "{{`{{ .Data.data.JWT_SECRET }}`}}"
          }
          {{`{{- end -}}`}}
      {{- end }}

    spec:
      serviceAccountName: {{ .Values.serviceAccounts.productService.name }}
      automountServiceAccountToken: {{ ternary true false .Values.productService.vault.enabled }}

      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: {{ .Values.productService.name }}

          image: "{{ .Values.productService.image.repository }}:{{ .Values.productService.image.tag }}"
          imagePullPolicy: {{ .Values.productService.image.pullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.productService.service.targetPort }}
              protocol: TCP

          env:
            - name: PORT
              value: {{ .Values.productService.env.port | quote }}

            - name: PRODUCT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.productService.env.databaseSecretName }}
                  key: {{ .Values.productService.env.databasePasswordKey }}

            - name: DATABASE_URL
              value: "postgresql://{{ .Values.productService.env.databaseUser }}:$(PRODUCT_DB_PASSWORD)@{{ .Values.productService.env.databaseHost }}:{{ .Values.productService.env.databasePort }}/{{ .Values.productService.env.databaseName }}"

            {{- if .Values.productService.vault.enabled }}
            - name: VAULT_ADMIN_AUTH_FILE
              value: {{ .Values.productService.vault.authFile | quote }}
            {{- end }}

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          resources:
{{ toYaml .Values.productService.resources | indent 12 }}

          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.productService.name }}
  namespace: {{ .Values.namespaces.product }}
  labels:
    app.kubernetes.io/name: {{ .Values.productService.name }}
    app.kubernetes.io/part-of: shoppay
  annotations:
    ingress.kubernetes.io/service-upstream: "true"

spec:
  type: {{ .Values.productService.service.type }}

  selector:
    app.kubernetes.io/name: {{ .Values.productService.name }}

  ports:
    - name: http
      port: {{ .Values.productService.service.port }}
      targetPort: http
      protocol: TCP

{{- end }}
