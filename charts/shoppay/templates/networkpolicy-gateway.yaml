{{- if .Values.networkPolicies.enabled }}

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-proxy-default-deny
  namespace: {{ .Values.namespaces.gateway }}
  labels:
    app.kubernetes.io/name: gateway-proxy-default-deny
    app.kubernetes.io/part-of: shoppay
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-proxy-allow-public-ingress
  namespace: {{ .Values.namespaces.gateway }}
  labels:
    app.kubernetes.io/name: gateway-proxy-allow-public-ingress
    app.kubernetes.io/part-of: shoppay
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-proxy-allow-controller-admin-ingress
  namespace: {{ .Values.namespaces.gateway }}
  labels:
    app.kubernetes.io/name: gateway-proxy-allow-controller-admin-ingress
    app.kubernetes.io/part-of: shoppay
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: controller
      ports:
        - protocol: TCP
          port: 8444

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-proxy-allow-dns-egress
  namespace: {{ .Values.namespaces.gateway }}
  labels:
    app.kubernetes.io/name: gateway-proxy-allow-dns-egress
    app.kubernetes.io/part-of: shoppay
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-proxy-allow-egress-to-product
  namespace: {{ .Values.namespaces.gateway }}
  labels:
    app.kubernetes.io/name: gateway-proxy-allow-egress-to-product
    app.kubernetes.io/part-of: shoppay
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.product }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.productService.name }}
      ports:
        - protocol: TCP
          port: {{ .Values.productService.service.targetPort }}

