{{- if and .Values.networkPolicies .Values.networkPolicies.enabled }}

# ---------------------------
# DEFAULT DENY
# ---------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-default-deny
  namespace: {{ .Values.namespaces.gateway }}
  labels:
    app.kubernetes.io/name: gateway-default-deny
    app.kubernetes.io/part-of: shoppay
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: app
      app.kubernetes.io/instance: kong
      app.kubernetes.io/name: kong
  policyTypes:
    - Ingress
    - Egress

---

# ---------------------------
# DNS EGRESS (IMPORTANT FIX)
# ---------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-allow-dns-egress
  namespace: {{ .Values.namespaces.gateway }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kong
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---

# ---------------------------
# FRONTEND INGRESS TO GATEWAY
# ---------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-allow-frontend-ingress
  namespace: {{ .Values.namespaces.gateway }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kong
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.frontend }}
      ports:
        - protocol: TCP
          port: 8000

---

# ---------------------------
# PRODUCT EGRESS
# ---------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-allow-egress-to-product
  namespace: {{ .Values.namespaces.gateway }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kong
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespaces.product }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: product-service
      ports:
        - protocol: TCP
          port: 4001

---

