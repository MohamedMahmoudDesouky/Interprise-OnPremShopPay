{{- if .Values.ingress.enabled }}

apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: {{ .Values.namespaces.gateway }}
  labels:
    app.kubernetes.io/name: product-service-upstream
    app.kubernetes.io/part-of: shoppay
spec:
  type: ExternalName
  externalName: product-service.{{ .Values.namespaces.product }}.svc.cluster.local
  ports:
    - name: http
      port: 4001
      targetPort: 4001
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: {{ .Values.namespaces.gateway }}
  labels:
    app.kubernetes.io/name: order-service-upstream
    app.kubernetes.io/part-of: shoppay
spec:
  type: ExternalName
  externalName: order-service.{{ .Values.namespaces.order }}.svc.cluster.local
  ports:
    - name: http
      port: 4002
      targetPort: 4002
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: {{ .Values.namespaces.gateway }}
  labels:
    app.kubernetes.io/name: payment-service-upstream
    app.kubernetes.io/part-of: shoppay
spec:
  type: ExternalName
  externalName: payment-service.{{ .Values.namespaces.payment }}.svc.cluster.local
  ports:
    - name: http
      port: 4003
      targetPort: 4003
---
apiVersion: v1
kind: Service
metadata:
  name: contact-service
  namespace: {{ .Values.namespaces.gateway }}
  labels:
    app.kubernetes.io/name: contact-service-upstream
    app.kubernetes.io/part-of: shoppay
spec:
  type: ExternalName
  externalName: contact-service.{{ .Values.namespaces.contact }}.svc.cluster.local
  ports:
    - name: http
      port: 4004
      targetPort: 4004

{{- end }}
