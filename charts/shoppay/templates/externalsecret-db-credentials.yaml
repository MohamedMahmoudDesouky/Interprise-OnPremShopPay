{{- if .Values.vault.enabled }}
{{- $dbServices := dict
  "product" (dict "namespace" .Values.namespaces.product "secretName" "product-db-credentials")
  "order"   (dict "namespace" .Values.namespaces.order   "secretName" "order-db-credentials")
  "payment" (dict "namespace" .Values.namespaces.payment "secretName" "payment-db-credentials")
  "contact" (dict "namespace" .Values.namespaces.contact "secretName" "contact-db-credentials")
}}
{{- range $service, $cfg := $dbServices }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $cfg.secretName }}
  namespace: {{ $cfg.namespace }}
  labels:
    app.kubernetes.io/part-of: shoppay
    app.kubernetes.io/managed-by: Helm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: {{ $cfg.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: shoppay/{{ $service }}/db-credentials
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: postgres-password
      remoteRef:
        key: shoppay/{{ $service }}/db-credentials
        property: postgres-password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: username
      remoteRef:
        key: shoppay/{{ $service }}/db-credentials
        property: username
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
{{- end }}
