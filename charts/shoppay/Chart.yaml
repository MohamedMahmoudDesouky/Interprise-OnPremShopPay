apiVersion: v2
name: shoppay
description: Enterprise-grade on-prem ShopPay microservices platform with Kong, Vault, PostgreSQL, and Kubernetes security controls.
type: application
version: 0.1.0
appVersion: "1.0.0"

dependencies:
  - name: postgresql
    version: 16.7.27
    repository: https://charts.bitnami.com/bitnami
    alias: product-postgresql
    condition: productPostgresql.enabled

  - name: postgresql
    version: 16.7.27
    repository: https://charts.bitnami.com/bitnami
    alias: order-postgresql
    condition: orderPostgresql.enabled

  - name: postgresql
    version: 16.7.27
    repository: https://charts.bitnami.com/bitnami
    alias: payment-postgresql
    condition: paymentPostgresql.enabled

  - name: postgresql
    version: 16.7.27
    repository: https://charts.bitnami.com/bitnami
    alias: contact-postgresql
    condition: contactPostgresql.enabled
