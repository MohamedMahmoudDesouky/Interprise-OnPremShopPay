apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: product-service
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/YOUR_USERNAME/YOUR_REPO.git
    targetRevision: main
    path: helm/product-service

  destination:
    server: https://kubernetes.default.svc
    namespace: shoppay

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
