# infra/vault/vault-dev-values.yaml
global:
  tlsDisable: true

server:
  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        listener "tcp" {
          tls_disable = 1
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }
        storage "raft" {
          path = "/vault/data"
        }
        service_registration "kubernetes" {}

  dev:
    enabled: false

  resources:
    requests:
      memory: 256Mi
      cpu: 250m
    limits:
      memory: 512Mi
      cpu: 500m

injector:
  enabled: true
  replicas: 1
  resources:
    requests:
      memory: 128Mi
      cpu: 100m

ui:
  enabled: true
  serviceType: "ClusterIP"
